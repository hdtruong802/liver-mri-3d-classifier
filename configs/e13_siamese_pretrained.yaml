# E13 — SIAMESE đa pha + encoder ResNet18-3D nạp MedicalNet, ở ĐỦ độ phân giải.
# Sinh từ baseline_3dpatch.yaml. Khác duy nhất trong khối `model:` (+ output_dir).
#
#   python -m src.train.run --config configs/e13_siamese_pretrained.yaml --fold 1
#   (notebook riêng đã xoá ở S-168 — nó có cổng đo hình dạng thật đi vào encoder,
#    phép kiểm đó KHÔNG có trong đường CLI; xem WORKLOG S-168)
#
# ---------------------------------------------------------------------------
# VÌ SAO: cách hợp nhất 8 thì là đòn bẩy lớn duy nhất còn lại
#
# Bốn bằng chứng độc lập chỉ về cùng một chỗ:
#
#   1. Bảng SDR-Former (cùng dataset, cùng test-104):
#        ResNet-50 early-fusion   0.6898
#        SNN-UniFormer-S          0.7639   <- +0.074 chỉ do bọc trong Siamese
#      Lớn hơn mọi thứ dự án đã thử cộng lại (E6, E6b, E12, TTA đều null).
#   2. Đội hạng 2 challenge dùng ResNet18 và đạt 0.8078 -> backbone không phải nút thắt.
#   3. Mọi phương pháp trên 0.75 trong bảng CGHNet đều xử lý TỪNG THÌ rồi mới hợp nhất.
#      Không ngoại lệ nào là early-concat.
#   4. Hai lớp yếu của ta là hai lớp chẩn đoán bằng ĐỘNG HỌC ngấm thuốc: ICC ngấm tiến
#      triển, di căn viền ngấm rồi thải. Ghép 8 thì thành 8 kênh của conv đầu là trộn
#      chúng ngay ở lớp 1, trước khi mạng học được đặc trưng nào để so giữa các thì.
#
# Ràng buộc số học, từ đúng số test-104 (ICC 0.519, di căn 0.273): giữ nguyên hai lớp
# đó thì kể cả 5 lớp kia đều đạt 0.90, macro-F1 cũng chỉ tới 0.756. Mọi hướng không
# dịch được hai lớp này đều không thể tới 0.75.
#
# ---------------------------------------------------------------------------
# VÌ SAO E2 THẤT BẠI, VÀ VÌ SAO LẦN NÀY KHÁC
#
# E2 chạy Siamese ở 48x48 in-plane trong khi văn liệu dùng 112-128, vì DenseNet121-3D
# hạ mẫu 5 lần và cần >= 32 ở mọi chiều, buộc `input_downsample: [2,2,1]`. WORKLOG
# S-065 kết luận: biến gây nhiễu độ phân giải là thủ phạm, KHÔNG phải ý tưởng Siamese.
#
# ResNet-3D hạ mẫu 16 lần rồi adaptive-pool, nên chạy được ở ĐỦ 112x112x32 với
# `input_downsample: [1,1,1]`. Và đo thật ở phiên 2026-08-10: ResNet18 early-concat
# tốn 18 s/epoch GPU trong khi CPU 41 s/epoch — còn hơn 2 lần dư địa GPU cho 8 lượt.
#
# ---------------------------------------------------------------------------
# CỘNG HƯỞNG THẬT giữa Siamese và pretrained
#
# Trọng số MedicalNet dành cho ảnh MỘT KÊNH. Ở chế độ Siamese encoder cũng nhìn đúng
# một thì mỗi lượt, nên conv đầu được dùng ĐÚNG NHƯ LÚC NÓ ĐƯỢC HỌC. Early-concat (E8)
# phải nhân bản conv đầu ra 8 kênh rồi chia cho 8 — một phép xấp xỉ không cần ở đây.
#
# Thêm nữa: encoder chạy `feed_forward=False` nên KHÔNG có `fc`, tức không khoá nào
# được phép thiếu. Cổng khớp trọng số vì thế chặt hơn trường hợp E8.
#
# ---------------------------------------------------------------------------
# PHÉP CÔ LẬP SẠCH NHẤT DỰ ÁN TỪNG CÓ
#
# E8 và E13 khác nhau ĐÚNG MỘT THỨ: early-concat so với Siamese. Cùng backbone
# ResNet18, cùng file trọng số, cùng cache E4, cùng loss, cùng recipe.
#
#     E13 - E8  =  hiệu ứng của riêng wrapper Siamese
#
# So trực tiếp được với +0.074 của SDR-Former:
#     python -m src.eval.compare --baseline runs/E8 --candidate runs/E13
#
# ---------------------------------------------------------------------------
# CÁCH ĐỌC KẾT QUẢ — CHỐT TRƯỚC KHI CHẠY
#
# Sàng fold 1+2 (162 ca). Mốc E4 trên đúng 162 ca đó: 0.6879.
#
#   fold 1+2      | kết luận
#   --------------|--------------------------------------------------------------
#   >= 0.79       | 0.75 trên test-104 còn khả thi -> chạy đủ 5 fold
#   0.72 - 0.79   | tiến bộ thật nhưng KHÔNG tới 0.75. Chạy 5 fold để có số, và
#                 | nói rõ mục tiêu không đạt
#   0.69 - 0.72   | ngang E4. Fusion cũng không phải đòn bẩy -> DỪNG
#   < 0.69        | lỗi triển khai, không phải kết luận khoa học. Soi cổng hình học
#
# Bar là 0.79 vì để test-104 đạt 0.75 thì out-of-fold phải ~0.82 (thiên lệch chọn
# epoch đã đo = -0.069). Bar thấp hơn chỉ là tự lừa mình.
#
# ⚠️ Dương trên 2 fold chỉ đủ để "chưa loại được". E6b sàng 2 fold cho +0.038 rồi
# 5 fold cho -0.002.
# ---------------------------------------------------------------------------

seed: 1337
fold: 1                       # 1..5; ghi đè bằng --fold
splits_dir: splits

# Đường dẫn ghi/đọc đi qua config, không hardcode /kaggle/... (AGENTS.md §7).
cache_dir: artifacts/cache            # env LLDMMRI_CACHE_DIR thắng
                                      #   Kaggle: cache E4, KHÔNG phải cache E12
output_dir: artifacts/runs/e13_siamese_pretrained   # env LLDMMRI_OUTPUT_DIR thắng

model:
  name: siamese_fusion
  num_phases: 8               # 8 thì, mỗi thì một lượt qua encoder DÙNG CHUNG
  num_classes: 7
  # --- encoder dùng chung ---
  encoder: resnet3d           # densenet121_3d là bản của E2, buộc hạ mẫu -> đã hỏng
  encoder_depth: 18
  # ⚠️ Cặp này KHÔNG được tự chọn: trọng số MedicalNet resnet18/34 sinh từ biến thể
  # ("A", true). `build_shared_encoder` đối chiếu với MEDICALNET_ARGS và từ chối chạy
  # nếu lệch. Đặt "B" thì ~18 khoá khởi tạo ngẫu nhiên mà tỉ lệ khớp vẫn báo ~85%.
  shortcut_type: A
  bias_downsample: true
  # Để TRỐNG. Đường dẫn thật truyền qua env LLDMMRI_PRETRAINED_PATH lúc chạy, cùng
  # quy ước với LLDMMRI_CACHE_DIR. Không có trọng số thì train from scratch + cảnh báo.
  pretrained_path: ""
  # Stride conv1. ĐO THẬT trên Kaggle 2026-08-10: với stride 1, Siamese tốn 79 s/epoch
  # GPU (thật tế 97-100 s/epoch kể cả val) so với 42 s/epoch CPU -> GPU thành nút thắt,
  # 8.3 h/fold, 5 fold = 41h, vượt trọn quota tuần.
  #
  # [2,2,1] hạ mẫu TRONG MẶT PHẲNG như Med3D và giữ nguyên trục z. Rẻ hơn 4 lần trên
  # toàn mạng vì mọi tầng sau cũng nhỏ đi 4 lần.
  #
  # ⚠️ THỨ TỰ TRỤC: tensor là [B, C, X, Y, Z] với Z là 32 lát, và MONAI trải giá trị
  # này ra ba chiều không gian theo đúng thứ tự đó. Đo thật:
  #     [1,1,1]  conv1 112x112x32  ...  layer4 7x7x2   (1.00x voxel)
  #     [2,2,1]  conv1  56x 56x32  ...  layer4 4x4x2   (0.25x)  <- đúng cái cần
  #     [1,2,2]  conv1 112x 56x16  ...  layer4 7x4x1   (0.25x)  <- LỆCH TRỤC, z còn 1 lát
  conv1_stride: [2, 2, 1]
  # --- ĐÂY LÀ CHỖ E2 CHẾT ---
  # [1,1,1] = KHÔNG hạ mẫu, encoder nhận đủ 112x112x32. E2 để [2,2,1] và chạy ở 48
  # in-plane, nên kết quả 0.35-0.49 của nó không nói gì về Siamese (S-065).
  input_downsample: [1, 1, 1]
  # --- hợp nhất 8 thì ---
  # `attention` trả kèm trọng số từng thì (`last_phase_weights`), dùng cho XAI ở W5 và
  # để đối chiếu với LI-RADS. `mean` là mốc so, `concat` giữ danh tính thì nhưng tầng
  # phân loại to gấp 8.
  fusion: attention
  # Trọng số dùng chung nên encoder KHÔNG phân biệt được arterial với T2WI. Không có
  # khoá này thì fusion kiểu mean hoàn toàn mù thứ tự thì, mà động học ngấm thuốc mới
  # là tín hiệu chẩn đoán mạnh nhất.
  phase_embedding: true
  dropout_prob: 0.2           # MC-dropout cần ít nhất một lớp Dropout
  # KHÔNG khai `embed_dim`: encoder chạy feed_forward=False nên đặc trưng cố định 512
  # chiều cho resnet18. Truyền giá trị khác sẽ bị từ chối thay vì bỏ qua âm thầm.
  #
  # Chỉ `batch` hợp lệ với trọng số MedicalNet: checkpoint mang running_mean/running_var
  # của BatchNorm, đổi norm thì những khoá đó mất đối tác.
  norm: batch

data:
  # VRAM ~16GB với khối [8,96,96,48]: batch nhỏ + tích luỹ gradient (AGENTS.md §7).
  batch_size: 2
  # Augmentation (xoay ±10° bằng scipy) chạy trên CPU trong worker và là nút cổ chai:
  # đo thật cho 56,5s/epoch, trong khi phần GPU chỉ ~20s — GPU ngồi chờ CPU
  # (WORKLOG S-044). Kaggle có 4 vCPU. Ba khoá dưới đây là tối ưu hoá THUẦN KỸ THUẬT,
  # không đụng gì tới phép toán train.
  num_workers: 4
  persistent_workers: true    # mặc định DataLoader dựng lại worker MỖI epoch × 300 epoch
  prefetch_factor: 4
  pin_memory: true
  # Augment theo recipe official: lật cả 3 trục p=0.5, xoay ±10°, random-crop tịnh
  # tiến. rot90 và nhiễu cường độ là thứ TA tự thêm, official không dùng -> tắt, giữ
  # code lại để ablate ở W4 (WORKLOG S-043).
  augment:
    flip_prob: 0.5
    flip_axes: [x, y, z]      # official: randomflip_x/_y/_z, mỗi trục p=0.5
    rotate_degrees: 10        # official: ndimage.rotate(angle=random(-10, 10))
    translate_voxels: [8, 8, 4]   # tương đương random_crop 128->112 của official
    rot90_prob: 0             # TẮT — xoay 90° không phải biến đổi giải phẫu hợp lệ
    intensity_prob: 0         # TẮT — official không dùng

# ---------------------------------------------------------------------------
# Toàn bộ khối này bám theo baseline official LLD-MMRI2023 (macro-F1 0.6083 trên
# test-104): LMMMEng/LLD-MMRI2023, `main/README.md` + `main/train.py`.
# KHÔNG có con số nào ở đây do tự nghĩ ra. GIỮ NGUYÊN từng chữ số so với baseline —
# E13 là phép đổi kiến trúc, không phải phép đổi recipe.
# ---------------------------------------------------------------------------
train:
  # official: --epochs 300, best checkpoint của họ ở epoch 216/300.
  epochs: 300
  warmup_epochs: 5            # official: --warmup-epochs 5
  warmup_lr: 0.000001         # official: --warmup-lr 1e-6
  lr: 0.0001                  # official: --lr 1e-4
  min_lr: 0.00001             # official: --min-lr 1e-5, scheduler cosine
  # official: --weight-decay 0.05. Bias và tham số norm bị loại khỏi decay
  # (src/train/run.py::build_param_groups), giống mặc định của timm mà official dùng.
  weight_decay: 0.05
  # official: batch 4 × 2 GPU = 8. Ta: batch_size 2 (giới hạn VRAM) × 4 = 8.
  accum_steps: 4
  # TẮT. official không early stop, chỉ train đủ 300 epoch rồi lấy checkpoint tốt nhất.
  early_stop_patience: 0
  amp: true                   # tự tắt khi chạy CPU
  deterministic: true
  resume: true                # chạy lại cùng lệnh = tiếp tục từ last.pt

loss:
  # GIỮ cross-entropy trần. Người dùng chốt không gộp focal + trọng số lớp vào E13
  # (2026-08-10), để E13 còn là phép đổi MỘT cụm biến và thắng thì quy kết được.
  # Nếu E13 qua bar mà ICC/di căn vẫn đứng yên thì đó là bước tiếp theo hiển nhiên.
  name: cross_entropy
  class_weights: none         # none | balanced | effective_number
  label_smoothing: 0.0        # official: --smoothing 0
