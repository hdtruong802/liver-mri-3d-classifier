# SDR-FORMER — TÁI LẬP TỪ BÀI BÁO. Mục tiêu đối chiếu: macro-F1 0.7910 trên nhánh MR 8 pha.
#
#   notebooks/25_sdrformer.ipynb   (dùng LẠI cache của configs/preprocess_cghnet.yaml)
#   python -m src.train.run --config configs/sdrformer.yaml --fold 1
#
# Nguồn: Lou, Ying, Liu, Zhou, Zhang, Yu, "SDR-Former: A Siamese Dual-Resolution Transformer
# for Liver Lesion Classification Using 3D Multi-Phase Imaging", arXiv:2402.17246 (2024).
# Nhóm này CHÍNH LÀ nhóm phát hành LLD-MMRI, nên mốc 0.7910 đo trên test-104 với nhãn họ giữ.
#
# ---------------------------------------------------------------------------
# ⚠️ TÁI LẬP TỪ VĂN BẢN, KHÔNG PHẢI CHẠY LẠI CODE CỦA TÁC GIẢ
#
# Mọi khoá dưới đây mang một trong ba nhãn. KHÔNG ĐƯỢC LẪN khi viết báo cáo.
#
#   [BÀI]  trích trực tiếp, có mục dẫn nguồn
#   [SUY]  bài không nói, ta suy — có ghi căn cứ
#   [LỆCH] ta CỐ Ý làm khác — có ghi lý do
#
# ---------------------------------------------------------------------------
# ⭐ VÌ SAO CHẠY CÁI NÀY: NÓ ĐỔI TRỤC THỨ BA
#
# UniFormer-Base (dung lượng lớn hơn) và UniFormerV2-B/16 (nguồn pretrain khác) đều KHÔNG
# vượt được `uniformer_s`. Hai trục đó đã cạn. Cấu hình này đổi trục "8 pha được KẾT HỢP thế
# nào" — thứ dự án chưa từng thử (mọi thí nghiệm đều là 8 pha vào làm 8 kênh).
#
# Bảng 1 của họ đo đúng trục đó, một biến, trên SÁU backbone, cùng dataset MR:
#
#     backbone        image-level   Siamese    hiệu
#     ResNet-50          0.6898     0.7168    +0.027
#     DenseNet-121       0.7171     0.7394    +0.022
#     MCSCNN             0.7089     0.7409    +0.032
#     BoTNet-50          0.7139     0.7572    +0.043
#     UniFormer-S        0.7123     0.7639    +0.052
#     H2Former           0.7342     0.7745    +0.040
#
# Sáu trên sáu đều dương, trung bình +0.036, transformer hưởng lợi hơn CNN (+0.045 so +0.027).
#
# ---------------------------------------------------------------------------
# ⚠️⚠️ ĐÁNH ĐỔI PHẢI BIẾT TRƯỚC: CẤU HÌNH NÀY BỎ TRỌNG SỐ PRETRAINED
#
# SDR-Former train FROM SCRATCH — không có checkpoint công khai cho DR-Former. Mà can thiệp
# duy nhất từng thắng có ý nghĩa thống kê trong dự án này chính là pretrained Kinetics
# (+0.130, P < 0.001). Ta đang cố ý vứt đòn bẩy mạnh nhất đã biết để thử một đòn bẩy mới.
#
#     UniFormer-S from scratch, recipe ban tổ chức    0.6083
#     UniFormer-S from scratch, recipe của họ         0.7123
#     SDR-Former  from scratch, recipe của họ         0.7910
#     ta: UniFormer-S + Kinetics                      0.7682 test-104 · 0.8147 out-of-fold
#
# 0.7910 chỉ hơn ta +0.023 trên test, nằm gọn trong CI ±0.09. ĐÂY KHÔNG PHẢI cấu hình chắc
# chắn tốt hơn — nó là một phép thử trục fusion, giá trị chính nằm ở chỗ đó.
#
# ---------------------------------------------------------------------------
# BAR QUYẾT ĐỊNH, CHỐT TRƯỚC KHI CHẠY (fold 1, so ghép cặp với fold 1 của uniformer_s = 0.8111)
#
#   >= 0.78   trục fusion có giá trị dù mất pretrained  => chạy đủ 5 fold
#   0.72-0.78 có tác dụng nhưng không bù được pretrained => cân nhắc, ưu tiên deliverable
#   0.65-0.72 ngang mức from-scratch tốt của họ (0.7123) => kết quả ÂM sạch, ghi lại và dừng
#   < 0.65    nghi LỖI TRIỂN KHAI hơn kết luận khoa học  => đọc lại cổng A và B
#
# ⚠️ 1 fold (n≈80, CI ~±0.19) chỉ đủ để LOẠI, KHÔNG đủ để CHỌN. Dự án đã bị cỡ mẫu nhỏ lừa
# BỐN lần (E6b, ensemble E4⊕CGHNet, và hai bộ số phụ trợ của UniFormer fold 1).
# ---------------------------------------------------------------------------

seed: 1337
fold: 1                       # 1..5; ghi đè bằng --fold
splits_dir: splits

# [BÀI] §4.2: "each lesion volume is uniformly resized to 16 x 128 x 128 ... we randomly crop
# the lesion volumes to 14 x 112 x 112". Khớp CHÍNH XÁC cache CGHNet — KHÔNG build cache mới.
cache_dir: artifacts/cache_cghnet        # env LLDMMRI_CACHE_DIR thắng
output_dir: artifacts/runs/sdrformer     # env LLDMMRI_OUTPUT_DIR thắng

model:
  name: sdrformer
  num_phases: 8
  num_classes: 7

  # [BÀI] Hình 2 — số kênh đọc thẳng từ các nhãn shape trên sơ đồ:
  #   nhánh CNN   1x16x112x112 -> 16x16x56x56 -> 32x16x28x28 -> 64x8x14x14 -> 128x8x14x14
  #   nhánh Trans 1x16x56x56   -> 16x16x28x28 -> 32x16x14x14 -> 64x8x7x7   -> 128x8x7x7
  # (họ vẽ ở 16 lát trước khi cắt; ta cắt còn 14 nên 16->14 và 8->7)
  stem_channels: 16
  stage_channels: [32, 64, 128]

  # ⚠️⚠️ SỐ THAM SỐ KHÔNG KHỚP BÀI — đọc trước khi diễn giải kết quả.
  #
  # Bảng 4 của bài: 19.34M tham số / 40.26 GFLOPs cho bản 8 pha. Bản dựng literal theo
  # Hình 2 (một block mỗi stage, W^2_3x3x3 đi 2C -> C -> C) cho ~12.7M. Thiếu ~6.6M và bài
  # KHÔNG cho đủ thông tin để biết thiếu ở đâu. Hai khoá dưới đây là hai chỗ khả dĩ nhất:
  #
  #   blocks_per_stage: 2   -> +~1.2M   (Hình 2 vẽ MỘT hộp, nhưng hộp thường ký hiệu nhóm lặp)
  #   bcim_hidden_mult: 2   -> +~3.5M   (W^2_3x3x3 đi 2C -> 2C -> C thay vì 2C -> C -> C)
  #
  # Bật cả hai cho ~17.3M, vẫn chưa đúng 19.34M.
  #
  # GIỮ BẢN LITERAL, và có lý do khoa học chứ không phải cho tiện: dự án vừa đo được rằng
  # TĂNG DUNG LƯỢNG LÀM TỆ ĐI trên 312 ca train (UniFormer-Base thua UniFormer-S). Bản nhỏ
  # hơn bài vì thế HỢP với chẩn đoán hiện tại, không phải một thiếu sót cần vá.
  #
  # ⚠️ Nhưng mọi câu trong báo cáo dùng số của cấu hình này BẮT BUỘC ghi rằng đây là bản tái
  # lập NHỎ HƠN bài, và 0.7910 chỉ là mốc định hướng chứ không phải mốc so được trực tiếp.
  blocks_per_stage: 1
  bcim_hidden_mult: 1

  # [SUY] Bài không nói số head. 4 chia hết cả 32/64/128 (kiểm bởi build_sdrformer).
  num_heads: 4
  # [SUY] Bài không nói mlp_ratio. 4.0 là mặc định của ViT/MaxViT.
  mlp_ratio: 4.0

  # [SUY] Kích thước lưới GSA. Bảng 5 chốt GSA nhưng KHÔNG nói lưới. 7x7 trong mặt phẳng là
  # mặc định của MaxViT (nơi GSA ra đời) và chia hết cả ba kích thước nhánh Transformer đi
  # qua (28, 14, 7). Trục lát lấy 2 vì D chỉ còn 14 rồi 7.
  # => 2*7*7 = 98 token mỗi nhóm attention ở MỌI stage. Rẻ, và cổng B in ra để kiểm.
  grid_size: [2, 7, 7]

  # [BÀI] §5.2.3 + Bảng 5: so Swin / SRA / PSA / GSA và chốt GSA. Ba cái kia là phần chọn
  # module của bài, không cài — truyền tên khác sẽ NỔ chứ không lặng lẽ rơi về mặc định.
  attention: gsa

  # [BÀI] Hai module lõi, Bảng 3. Tắt để dựng lại đúng ba hàng ablation của họ.
  # ⚠️ Mỗi lần chạy tốn đủ một fold. ĐỪNG bật ablation cho tới khi bản đủ bộ có 5 fold —
  # sàng cỡ nhỏ trên nhiều nhánh rồi chọn nhánh thắng là đúng lỗi đã mắc ba lần.
  use_bcim: true
  use_apsm: true

  # [SUY] Bài không nói dropout. Giữ > 0 vì src/eval/mc_dropout.py cần ít nhất một lớp
  # Dropout — bất định epistemic là đóng góp headline của dự án. `uniformer_s` để 0.0 nên
  # MC-dropout vô nghĩa ở đó; cấu hình này lấy lại được đại lượng đó.
  dropout_prob: 0.2

data:
  # [BÀI] §4.2: "Due to hardware limitations, our batch size is set to 8".
  # ⚠️ Khác mọi config khác của dự án (đều 4). Mô hình này đầy BatchNorm và Siamese làm batch
  # hiệu dụng của encoder thành 8*8 = 64 volume, nên thống kê BN rất ổn định.
  # ⚠️ Nếu cổng C báo OOM: batch_size 4 + accum_steps 2 giữ nguyên batch hiệu dụng, nhưng
  # BN sẽ thấy 32 volume thay vì 64 — một chỗ lệch phải ghi.
  batch_size: 8
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true

  # [BÀI] §4.2: "we randomly crop the lesion volumes to 14 x 112 x 112, while for evaluation,
  # a central crop of the same size is extracted". Thứ tự của họ là D x H x W.
  crop_size: [112, 112, 14]

  # [BÀI] §4.2 không nhắc lấy mẫu lại — họ chỉ dùng cross-entropy trần.
  sampling: instance

  # [LỆCH] Mixup không có trong bài.
  mixup_alpha: 0.0

  augment:
    # [BÀI] §4.2: "random rotations, erasing, and flips across different anatomical axes".
    # [SUY] Bài không nói xác suất; 0.5 là quy ước của dự án và của bài CGHNet.
    flip_prob: 0.5
    flip_axes: [x, y, z]

    # [SUY] Bài không nói biên độ xoay. 10 độ theo baseline official của challenge.
    rotate_degrees: 10
    rotate_prob: 0.5
    # [LỆCH] `nearest` — cùng lý do đã ghi ở configs/uniformer_s.yaml và cghnet.yaml: lề
    # cache chỉ 8 voxel trong mặt phẳng, mà xoay 10 độ làm hỏng góc tới ~12 voxel (đo ở E12).
    # Với `constant` thì cắt ngẫu nhiên ở offset biên để lọt voxel bị lấp 0 (WORKLOG S-111).
    rotate_mode: nearest

    # TẮT: RandomCrop3D (bật bởi crop_size) đã làm việc dịch mà không đệm 0.
    translate_voxels: [0, 0, 0]
    rot90_prob: 0               # xoay 90 độ không phải biến đổi giải phẫu hợp lệ
    intensity_prob: 0           # bài không dùng; và E6 đã đo nó gây hại (S-102)

    # [LỆCH] ⚠️ CHỖ THIẾU DUY NHẤT so với danh sách augmentation của bài: "random ERASING".
    # Dự án không có RandomErasing3D và lần này không cài thêm. Phải ghi vào báo cáo.
    # Ba augment lọc không gian của recipe hạng 2 (edge/emboss/filter) KHÔNG có trong bài này,
    # nên để 0 — bật chúng là trộn hai recipe khác nhau.
    edge_prob: 0
    emboss_prob: 0
    filter_prob: 0

loss:
  # [BÀI] §4.2: "The standard cross-entropy loss function is employed".
  # ⚠️ Đây là chỗ khác hẳn mọi cấu hình gần đây của dự án (đều focal). Bài KHÔNG dùng focal,
  # KHÔNG dùng trọng số lớp, KHÔNG dùng label smoothing — dù họ có đúng bài toán mất cân bằng
  # 7 lớp này. Giữ trung thực; đổi sang focal là một thí nghiệm KHÁC.
  name: cross_entropy
  class_weights: none
  label_smoothing: 0.0
  deep_supervision: false     # SDR-Former một đầu ra, không như CGHNet

train:
  # [BÀI] §4.2: "The training process spans over 200 epochs, with the first 5 epochs
  # designated as a warm-up phase".
  # ⚠️ 200, KHÔNG phải 300 như uniformer_s/cghnet. Đừng "thống nhất" nó cho đều.
  epochs: 200
  warmup_epochs: 5
  warmup_lr: 0.000001
  min_lr: 0.00001
  # [BÀI] "AdamW optimizer, starting with an initial learning rate of 0.0001, which is
  # dynamically adjusted using a cosine annealing schedule".
  lr: 0.0001
  # [BÀI] "A weight decay of 0.05 is applied to prevent overfitting".
  weight_decay: 0.05
  # Hiệu dụng = batch_size 8 x 1 = 8, đúng của bài.
  accum_steps: 1
  early_stop_patience: 0      # bài train đủ 200 epoch, không early stop
  amp: true
  deterministic: true
  resume: true
