# Cấu hình dữ liệu LLD-MMRI. KHÔNG hardcode path trong code (AGENTS.md §7).
# Đường dẫn Kaggle khai ở data_root_candidates bên dưới — thêm vào đó khi mount đổi
# chỗ, đừng sửa rải rác trong code/notebook. Env LLDMMRI_DATA_ROOT ghi đè được, nhưng
# cũng bị xác minh (env sót từ lần chạy trước là bẫy có thật — WORKLOG S-027).

data_root: data/lldmmridataset          # mặc định cho máy local (thư mục chứa lld/)

# Ứng viên khi chạy trên Kaggle — thử theo thứ tự, chỉ nhận đường dẫn THẬT SỰ chứa
# annotation_rel. Kaggle đổi sơ đồ mount tuỳ lúc nên phải dò, không hardcode một cái.
data_root_candidates:
  - /kaggle/input/datasets/marcohoang/lldmmridataset
  - /kaggle/input/lldmmridataset

# Nếu không ứng viên nào khớp: tự lùng annotation_rel dưới các thư mục này (giới hạn
# độ sâu). Nhờ vậy không cần biết trước sơ đồ mount của Kaggle — đã đoán sai 2 lần.
data_root_search:
  - /kaggle/input

annotation_rel: lld/LLD_MMRI_Annotation.json
images_rel: lld/images                   # ảnh; luôn bỏ qua lld/.cache (rác tải của HuggingFace)

# Mask tổn thương: 3984 file, đúng một mask cho mỗi (bệnh nhân × thì), cùng quy ước
# tên với ảnh. CHỈ dùng khi preprocess.yaml đặt crop_mode=lesion_tight và source=mask.
#
# CẢNH BÁO: đây là mask do **MedSAM2 sinh tự động**, không phải bác sĩ vẽ (WORKLOG
# S-021). Dùng để định vị và định kích thước tổn thương thì được; KHÔNG được coi là
# nhãn segmentation chuẩn vàng, và không dùng làm mục tiêu giám sát mà không nêu rõ
# giới hạn này trong báo cáo.
labels_rel: lld/labels

# Mask KHÔNG mang hậu tố kênh `_0000` như ảnh (quy ước nnU-Net):
#   lld/images/MR-391135_1_C+V_0000.nii   <- image_suffixes
#   lld/labels/MR-391135_1_C+V.nii        <- label_suffixes
# Dùng nhầm danh sách đuôi của ảnh sẽ khớp 0 file và cả mẻ build lặng lẽ rơi về
# bbox (WORKLOG S-059). Giờ build_cache dừng hẳn nếu quét ra 0 mask.
label_suffixes: [".nii.gz", ".nii"]
splits_dir: splits

# 8 thì MRI. `name` = tên trong annotation JSON; `file` = token trong tên file ảnh.
# Chú ý: annotation dùng "In Phase"/"Out Phase" (có dấu cách), tên file là "InPhase"/"OutPhase".
phases:
  - {name: "C-pre",     file: "C-pre"}
  - {name: "C+A",       file: "C+A"}
  - {name: "C+V",       file: "C+V"}
  - {name: "C+Delay",   file: "C+Delay"}
  - {name: "T2WI",      file: "T2WI"}
  - {name: "DWI",       file: "DWI"}
  - {name: "In Phase",  file: "InPhase"}
  - {name: "Out Phase", file: "OutPhase"}

# Đuôi tên file ảnh: {patient}_{lesion}_{file_token}{suffix}
# Phải liệt kê CẢ HAI: repo HuggingFace gốc lưu .nii.gz, nhưng bản trên Kaggle đã
# được giải nén thành .nii (WORKLOG S-025). Chỉ khai một đuôi ⇒ không tìm thấy
# file nào và mọi bước sau bị bỏ qua âm thầm.
image_suffixes:
  - "_0000.nii.gz"
  - "_0000.nii"

seed: 42
