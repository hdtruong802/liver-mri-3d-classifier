# Cấu hình dữ liệu LLD-MMRI. KHÔNG hardcode path trong code (AGENTS.md §7).
# Ghi đè data_root bằng env LLDMMRI_DATA_ROOT (vd Kaggle: /kaggle/input/lldmmridataset).

data_root: data/lldmmridataset          # mặc định cho máy local (thư mục chứa lld/)

# Ứng viên khi chạy trên Kaggle — thử theo thứ tự, chỉ nhận đường dẫn THẬT SỰ chứa
# annotation_rel. Kaggle đổi sơ đồ mount tuỳ lúc nên phải dò, không hardcode một cái.
data_root_candidates:
  - /kaggle/input/datasets/marcohoang/lldmmridataset
  - /kaggle/input/lldmmridataset

annotation_rel: lld/LLD_MMRI_Annotation.json
images_rel: lld/images                   # chỉ đọc thư mục này; BỎ lld/labels (mask) + lld/.cache
splits_dir: splits

# 8 thì MRI. `name` = tên trong annotation JSON; `file` = token trong tên file ảnh.
# Chú ý: annotation dùng "In Phase"/"Out Phase" (có dấu cách), tên file là "InPhase"/"OutPhase".
phases:
  - {name: "C-pre",     file: "C-pre"}
  - {name: "C+A",       file: "C+A"}
  - {name: "C+V",       file: "C+V"}
  - {name: "C+Delay",   file: "C+Delay"}
  - {name: "T2WI",      file: "T2WI"}
  - {name: "DWI",       file: "DWI"}
  - {name: "In Phase",  file: "InPhase"}
  - {name: "Out Phase", file: "OutPhase"}

# Đuôi tên file ảnh: {patient}_{lesion}_{file_token}{suffix}
# Phải liệt kê CẢ HAI: repo HuggingFace gốc lưu .nii.gz, nhưng bản trên Kaggle đã
# được giải nén thành .nii (WORKLOG S-025). Chỉ khai một đuôi ⇒ không tìm thấy
# file nào và mọi bước sau bị bỏ qua âm thầm.
image_suffixes:
  - "_0000.nii.gz"
  - "_0000.nii"

seed: 42
