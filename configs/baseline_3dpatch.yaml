# Baseline 3D-patch — mốc so sánh đầu tiên của dự án (W2 ngày 5).
# Mọi hyperparam ở đây, code chỉ đọc (AGENTS.md §8).
#
#   python -m src.train.run --config configs/baseline_3dpatch.yaml --fold 1
#
# Đây KHÔNG phải model chính. Model chính chốt ở W4 sau khi có CV 5-fold + CI.

seed: 1337
fold: 1                       # 1..5; ghi đè bằng --fold
splits_dir: splits

# Đường dẫn ghi/đọc đi qua config, không hardcode /kaggle/... (AGENTS.md §7).
cache_dir: artifacts/cache            # env LLDMMRI_CACHE_DIR thắng
                                      #   Kaggle: /kaggle/input/lld-mmri-3/cache
output_dir: artifacts/runs/baseline_3dpatch   # env LLDMMRI_OUTPUT_DIR thắng
                                              #   Kaggle: /kaggle/working/runs/...

model:
  name: densenet121_3d
  in_channels: 8              # 8 pha ghép kênh = early-concat v0
  num_classes: 7
  dropout_prob: 0.2
  # Bằng chứng đã có, KHÔNG phải phỏng đoán (WORKLOG S-036 → S-039):
  #   batch            -> macro-F1 val 0.2725 @ epoch 11   (chạy thật, fold 1)
  #   instance+affine  -> SẬP: đoán 1 lớp, macro-F1 0.0668 đứng yên, loss = ln 7
  #   group            -> chưa có số trên tập thật
  # Phép thử overfit 8 mẫu (notebook mục 1b, WORKLOG S-040) — loss cuối sau 160 bước:
  #   batch 0.009 · group(8) 0.010 · instance+affine 0.581   (cả ba đều acc 1.00)
  # => InstanceNorm KHÔNG hỏng cấu trúc như tôi đã kết luận vội, chỉ chậm hơn ~60 lần.
  #    batch và group khoẻ ngang nhau, phép thử này không tách được hai cái đó.
  # Giữ `batch` vì là lựa chọn duy nhất có số trên tập thật (0.2725). Đổi `norm` là
  # thí nghiệm riêng, đừng gộp chung với thay đổi nào khác.
  norm: batch

data:
  # VRAM ~16GB với khối [8,96,96,48]: batch nhỏ + tích luỹ gradient (AGENTS.md §7).
  batch_size: 2
  num_workers: 2
  pin_memory: true
  augment:
    flip_prob: 0.5            # chỉ lật trong mặt phẳng — xem src/data/transforms.py
    rot90_prob: 0.5
    intensity_prob: 0.5
    intensity_shift: 0.1
    intensity_scale: 0.1

train:
  epochs: 60
  # batch hiệu dụng = 2 × 2 = 4. Hạ từ 8 (hiệu dụng 16) sau khi có bằng chứng model
  # đang bị THIẾU BƯỚC CẬP NHẬT, chứ không phải thiếu khả năng học (WORKLOG S-040):
  #   - phép thử overfit: 160 bước ở lr 1e-3 là thuộc lòng 8 mẫu -> kiến trúc ổn;
  #   - run thật: 312 mẫu / (2×8) = ~20 bước/epoch, 26 epoch = ~520 bước, mà train
  #     loss mới đi 1.96 -> 1.64 (ngẫu nhiên = ln 7 = 1.946). Mới chỉ khởi động.
  # accum 8 -> 2 cho ~78 bước/epoch, gấp 4 lần, **cùng thời gian mỗi epoch** (số lần
  # forward/backward không đổi). Hiệu dụng 4 cũng hợp lý hơn với 312 mẫu so với 16.
  # Lệch khuyến nghị "hiệu dụng 16–32" ở AGENTS.md §7 — chỗ đó viết cho ràng buộc
  # VRAM, không phải cho kích thước dataset; đã ghi lý do vào WORKLOG.
  accum_steps: 2
  lr: 0.0003
  weight_decay: 0.00001
  amp: true                   # tự tắt khi chạy CPU
  # Bật cudnn.deterministic, NHƯNG đừng hiểu là tái lập bit-exact: docstring của
  # MONAI ghi rõ DenseNet với spatial_dims=3 là non-deterministic trên CUDA. Seed cố
  # định cho phép lặp lại *thí nghiệm*, không phải lặp lại từng chữ số. Báo cáo phải
  # nói đúng điều này, và đó là một lý do nữa để mọi số đều kèm CI (AGENTS.md §3.5).
  deterministic: true
  early_stop_patience: 15     # theo macro-F1 val
  resume: true                # chạy lại cùng lệnh = tiếp tục từ last.pt

loss:
  name: cross_entropy
  class_weights: balanced     # none | balanced (tính CHỈ từ nhãn train)
  label_smoothing: 0.0
