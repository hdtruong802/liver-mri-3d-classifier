# E3 — tiền xử lý với HÌNH HỌC KHỚP VĂN LIỆU. Chép từ configs/preprocess.yaml,
# chỉ đổi target_size và cache_dir.
#
#   python -m src.preprocess.build_cache --config configs/preprocess_e3.yaml
#
# Tiền xử lý LLD-MMRI: resample 8 pha lên MỘT lưới mm chung quanh tổn thương.
# Mọi hyperparam ở đây, code chỉ đọc (AGENTS.md §8). Chạy một lần rồi cache
# thành Kaggle Dataset có version (AGENTS.md §7).
#
# Cache đã tạo sau build (Kaggle Dataset phải giữ Private theo license dữ liệu):
kaggle_dataset_slug: ""        # điền sau khi upload cache E3
kaggle_dataset_version: 0

# --- Thứ tự trục: bbox.x ứng với trục 0 ('xy') hay trục 1 ('yx') của mảng ---
# Phán quyết trên toàn bộ 498 bệnh nhân (WORKLOG S-031), đo độ hội tụ của tâm tổn
# thương giữa các pha trong toạ độ mm, chỉ tính trong mặt phẳng:
#   180/498 ca có sức phân biệt · xy 166 phiếu (92%) · yx 14 phiếu (8%)
#   độ tán trong mặt phẳng, trung vị: xy 12.4mm · yx 17.8mm
# Phân rã theo trục cho thấy X là chỗ khác biệt (7.4mm với 'xy' so với 13.9mm với
# 'yx'), còn Z giống hệt nhau (23.3mm — chuyển động hô hấp, không liên quan trục).
# Vẫn nên xác nhận bằng overlay (notebook 02 mục 2) trước khi build cả mẻ.
axis_order: xy

# --- Pha tham chiếu: định hướng + tâm của lưới đích ---
# Portal-venous theo Spec Sheet §2 (pha có độ tương phản gan-tổn thương tốt nhất).
reference_phase: "C+V"

# --- Chế độ cắt ---
# fixed_mm    : cửa sổ vật lý cố định cho mọi ca (bản v0, đã build).
# lesion_tight: cửa sổ co giãn theo kích thước tổn thương (xem src/preprocess/crop.py).
#
# Vì sao có chế độ thứ hai: với fixed_mm, tổn thương 20mm chỉ chiếm ~14% bề rộng
# khung 144mm, model phải tự học bỏ qua 86% còn lại với 316 ca. Baseline chính
# thức của challenge cắt bám sát tổn thương rồi resize về 112×112×14, và cả ba đội
# đầu bảng đều xoay quanh định vị/căn tổn thương chứ không phải backbone.
#
# ĐỔI GIÁ TRỊ NÀY = ĐỔI DỮ LIỆU. Phải build cache mới vào thư mục khác, không ghi
# đè cache cũ — nếu không thì không còn so sánh có kiểm soát được nữa.
crop_mode: lesion_tight       # fixed_mm | lesion_tight

lesion_tight:
  # Lấy kích thước tổn thương từ đâu. 'mask' chính xác hơn 'bbox' nhưng mask của
  # LLD-MMRI là do MedSAM2 sinh, KHÔNG phải bác sĩ vẽ (WORKLOG S-021) — dùng để
  # định vị thì tốt, đừng coi là chuẩn vàng. Thiếu mask thì tự rơi về bbox và ghi
  # lại ở cột crop_source của build_log.csv.
  source: mask                # bbox | mask
  # Cửa sổ = kích thước tổn thương × hệ số này. 1.6 để lại viền mô quanh tổn
  # thương — bối cảnh gan lành sát bên có giá trị chẩn đoán (vd vành sáng của FNH).
  margin_factor: 1.6
  # Sàn: tổn thương rất nhỏ mà cắt sát sẽ phóng đại thành ảnh mờ toàn nhiễu.
  min_fov_mm: [40.0, 40.0, 40.0]
  # Trần: tổn thương rất lớn không được kéo cửa sổ ra tới mức quay về fixed_mm.
  max_fov_mm: [200.0, 200.0, 200.0]

# --- Lưới đích ---
# target_size là số voxel đầu ra, luôn cố định để model nhận đúng một kích thước.
# target_spacing CHỈ dùng khi crop_mode = fixed_mm; ở lesion_tight, spacing được
# suy ra từ fov_mm / target_size nên biến thiên theo từng bệnh nhân.
#
# Ghi chú cho fixed_mm: 96×96×48 @1.5×1.5×3.0mm = 144×144×144mm. EDA: lesion p95 =
# 97.6×98.5×78.0mm -> đủ phủ p95 kèm margin. ~5% ca lớn nhất (max 179.7mm) bị cắt
# cụt rìa; tâm vẫn đúng. Ghi vào limitations của báo cáo.
target_spacing: [1.5, 1.5, 3.0]

# ---------------------------------------------------------------------------
# ĐÂY LÀ KHOÁ DUY NHẤT KHÁC configs/preprocess.yaml (ngoài cache_dir).
#
# Mọi phương pháp đã công bố trên LLD-MMRI đều dùng ÍT LÁT, NHIỀU PIXEL TRONG
# MẶT PHẲNG. Ta đang làm ngược lại:
#
#     baseline official      14 lát × 112       176k voxel
#     CGHNet 2026            14-16 lát × 112-128    229-262k voxel
#     ta (E0/E1)             48 lát × 96        442k voxel   <- ngoại lệ
#     E2 sau hạ mẫu          48 lát × 48        111k voxel   <- tệ nhất
#
# Lý do vật lý: MRI gan bất đẳng hướng nặng (in-plane ~0.78mm, lát dày 2-9mm).
# Xử lý bằng conv 3D kernel đều là tiêu tham số cho trục vốn ít thông tin, vừa
# chậm vừa dễ overfit. CGHNet đo trực tiếp điều này trên chính dataset: nhánh 2D
# đạt F1 74.2 còn nhánh 3D chỉ 72.4, và họ ghi rõ lý do là "fine-grained
# intra-slice semantics are easier to optimize than volumetric features under
# limited data regimes".
#
# Vì sao 112 × 112 × 32 chứ không phải 128 × 128 × 16 như CGHNet:
#   - 112 khớp đúng kích thước crop của cả baseline official lẫn CGHNet;
#   - Z = 32 là mức THẤP NHẤT DenseNet121-3D chịu được. Z = 16 sẽ SẬP: sau conv0,
#     pool0 và hai transition, 16 chỉ còn 1, và transition thứ ba dùng
#     AvgPool3d(kernel=2) (WORKLOG S-063). CGHNet dùng ViT + CNN nên không vướng.
#
# 401k voxel ≈ 0.91× E1, tức rẻ hơn một chút. Đổi giá trị này = ĐỔI DỮ LIỆU:
# phải build sang cache_dir khác, không ghi đè cache E1.
# ---------------------------------------------------------------------------
target_size: [112, 112, 32]
interpolator: linear          # linear | nearest | bspline

# --- Chuẩn hoá cường độ ---
# MRI không có đơn vị chuẩn như HU của CT -> phải chuẩn hoá theo từng chuỗi.
# scope=volume: tính thống kê trên TOÀN volume gốc (trước khi crop) để giữ tương
# phản tổn thương-so-với-gan; scope=crop thì chỉ dùng vùng đã cắt.
# LƯU Ý LEAKAGE: thống kê lấy từ chính volume của bệnh nhân đó (per-sample), KHÔNG
# gộp qua nhiều bệnh nhân -> không vi phạm AGENTS.md §3.3.
normalize:
  clip_percentile: [0.5, 99.5]
  scope: volume               # volume | crop

# --- N4 bias field correction ---
# Rất chậm (vài phút/volume × 3984 volume). Kill-switch đã chốt: off ở v0.
n4: false

# --- Đầu ra ---
output_dtype: float16         # 498 ca × [8,112,112,32] ≈ 3.2GB
# Thư mục RIÊNG. Trùng cache_dir với E1 là ghi đè dữ liệu của thí nghiệm trước,
# và build_cache có resume nên nó sẽ lặng lẽ TRỘN hai hình học vào cùng một mẻ.
cache_dir: artifacts/cache_e3_112x112x32
# ^ ghi đè bằng env LLDMMRI_CACHE_DIR (Kaggle: /kaggle/working/cache).
# Thư mục KHÁC cache v0 là cố ý: hai cache phải cùng tồn tại để so sánh có kiểm
# soát (cùng split, cùng seed, cùng recipe train — chỉ đổi dữ liệu đầu vào).
