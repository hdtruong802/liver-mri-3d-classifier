# UNIFORMER-S + TRỌNG SỐ KINETICS — TÁI LẬP RECIPE ĐỘI HẠNG 2 LLD-MMRI 2023.
#
#   notebooks/20_uniformer.ipynb   (dùng LẠI cache của configs/preprocess_cghnet.yaml)
#
# Nguồn: https://github.com/ZHEGG/miccai2023 — repo của đội `NPUBXY`.
# Leaderboard official: https://github.com/LMMMEng/LLD-MMRI2023/blob/main/assets/test_leaderboard.md
#
# ---------------------------------------------------------------------------
# ⚠️ ĐÂY LÀ HẠNG 2 (0.8078), KHÔNG PHẢI HẠNG 1
#
# README của repo tự ghi "second-place solution", và leaderboard xác nhận:
#     hạng 1  WorkingisAllyouneed  0.8322      hạng 2  NPUBXY  0.8078
# Đừng viết "tái lập đội hạng 1" trong báo cáo.
#
# ---------------------------------------------------------------------------
# VÌ SAO CẤU HÌNH NÀY LÀ PHÉP SO MỘT BIẾN ĐẸP NHẤT CỦA BÀI TOÁN
#
# Baseline official của challenge CHÍNH LÀ UniFormer-S 3D, from scratch, 300 epoch → 0.6083.
# Repo này dùng ĐÚNG kiến trúc đó, và `train.sh` của họ bật `--pretrained` (Kinetics-400).
#
#     0.6083   UniFormer-S, from scratch                    (baseline official)
#     0.8078   UniFormer + Kinetics + cb_loss + sqrt + smoothing + drop-path + 3 aug lọc
#
# ⚠️ Chênh ~0.20 đó KHÔNG phải phép thử một biến sạch — nó gộp 6 thứ. Tái lập cả cụm thì chỉ
# quy kết được cho CẢ CỤM. Ghi rõ trong báo cáo, đừng nói "pretrained cho +0.20".
#
# ---------------------------------------------------------------------------
# NHÃN: mỗi khoá dưới đây là một trong ba loại. KHÔNG ĐƯỢC LẪN khi viết báo cáo.
#
#   [REPO]  đọc trực tiếp từ `train.sh` hoặc code của họ
#   [SUY]   họ không nói, ta suy — có ghi căn cứ
#   [LỆCH]  ta CỐ Ý làm khác họ — có ghi lý do và bằng chứng
# ---------------------------------------------------------------------------

seed: 1337
fold: 1                       # 1..5; ghi đè bằng --fold
splits_dir: splits

# Dùng LẠI cache CGHNet: lưới 128×128×16, cắt 112×112×14.
# [REPO] `--img_size 16 128 128 --crop_size 14 112 112` — khớp CHÍNH XÁC, không build cache mới.
cache_dir: artifacts/cache_cghnet        # env LLDMMRI_CACHE_DIR thắng
output_dir: artifacts/runs/uniformer_s    # env LLDMMRI_OUTPUT_DIR thắng

model:
  name: uniformer3d
  # [REPO] `--model uniformer_base_original`. Ta làm `small` vì HuggingFace
  # `Sense-X/uniformer_video` có ĐÚNG file trọng số của bản small
  # (`uniformer_small_k400_16x8.pth`), còn bản base 16x8 của họ chỉ có trên Google Drive.
  # small là 3/6 thành viên ensemble của họ (fold 2, 3, 5).
  variant: small
  in_channels: 8              # 8 pha MRI vào làm KÊNH (không phải làm trục thời gian)
  num_classes: 7

  # [REPO] `PatchEmbed(patch_size=(1,2,2))` với `stride=None` ⇒ stride = patch_size.
  # Thứ tự (D, H, W) theo quy ước của MODEL; `forward` tự hoán vị [X,Y,Z] của cache sang đó.
  #
  # ⚠️ NÚT THẮT NGÂN SÁCH: (1,2,2) KHÔNG hạ mẫu trục lát, nên đắt hơn bản pretrained:
  #     stage 3 (SABlock ×8, attention TOÀN CỤC)
  #        bản pretrained 16×224×224 → 8×14×14  = 1568 token
  #        cấu hình này  14×112×112 → 14×14×14 = 2744 token   (1.75×, chi phí ~3×)
  # Cổng C của notebook đo s/epoch THẬT. Quá 60 s/epoch thì đổi sang [2,2,2]:
  # lát 14→7, còn 1372 token — dưới cả bản pretrained.
  # ⚠️ ĐỪNG suy giờ từ GFLOPs: ước lượng kiểu đó cho CGHNet đã sai xa (WORKLOG S-123).
  patch_embed1_stride: [1, 2, 2]

  # [REPO] factory của họ không truyền `drop_rate`, và `--drop` của timm mặc định 0.0.
  drop_rate: 0.0
  # [REPO] `--drop-path 0.1`.
  drop_path_rate: 0.1

  # [LỆCH] Bổ sung của dự án, họ KHÔNG có. `src/eval/mc_dropout.py` cần ít nhất một lớp
  # Dropout để có bất định epistemic — đóng góp headline của dự án.
  # Giữ 0.0 ở run tái lập để trung thực với họ.
  # ⚠️ Với 0.0 thì model KHÔNG có lớp Dropout nào, nên notebook 08 (MC-dropout) sẽ trả K lượt
  # GIỐNG HỆT nhau — vô nghĩa mà không nổ. Muốn MC-dropout thì tạo config riêng đặt 0.2.
  head_dropout: 0.0

  # Nổ nếu không tìm thấy trọng số, thay vì lặng lẽ train from scratch. Cả thí nghiệm này tồn
  # tại để đo tác dụng của pretrained; chạy nó mà không có trọng số là một thí nghiệm KHÁC.
  require_pretrained: true
  # Để null: env LLDMMRI_PRETRAINED_PATH thắng. Ghi cứng đường dẫn mount là lớp lỗi đã phải
  # sửa bốn lần (WORKLOG S-081 → S-084).
  pretrained_path: null

data:
  # [REPO] `--batch-size 4`. Họ chạy DDP 2 GPU nên hiệu dụng có thể là 8; ta 1 GPU nên
  # hiệu dụng 4 với accum_steps 1. Một chỗ không chắc, đã ghi.
  batch_size: 4
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true

  # [REPO] `--crop_size 14 112 112` (thứ tự D×H×W của họ) → [112,112,14] theo [X,Y,Z] của ta.
  crop_size: [112, 112, 14]

  # [REPO] `--sampling sqrt` — trọng số mỗi lớp ∝ count^(−0.5).
  # ⚠️ Đây là lớp cân bằng THỨ HAI, cộng với `class_weights` ở khối `loss` bên dưới. Recipe của
  # họ bật cả hai. Chẩn đoán §1 của dự án (ICC dự đoán thừa 1.26×, áp-xe 1.31× trên E4) nói
  # điều này đi NGƯỢC bằng chứng — nhưng §1 đo trên DenseNet from scratch, không phải ở đây.
  # Cổng D của notebook đo lại cán cân dự đoán sau fold 1. Nếu vượt 1.4× thì `sampling:
  # instance` là ablation MỘT khoá.
  sampling: sqrt

  # ⚠️ ĐÍNH CHÍNH 2026-08-11 (S-128): ghi chú trước ở đây nói "`--mixup` là cờ chết vì
  # `train.py` không nối nhánh mixup nào" — SAI. Mixup của họ nằm trong **dataset**, không
  # phải vòng train: `mp_liver_dataset.py::__getitem__` gọi `self.mixup(image, label)` khi
  # `args.mixup and label != 6`.
  #
  # Và nó là một phép KHÁC HẲN loại mixup mà `data.mixup_alpha` cài. Chú thích của chính họ
  # là `类内mixup` — **mixup TRONG CÙNG LỚP**:
  #     lam = np.random.beta(1.0, 1.0)            # = Uniform(0, 1)
  #     image = lam * image + (1 - lam) * image_cung_lop
  #     # nhãn GIỮ NGUYÊN, không trộn
  # tức nội suy hai ca cùng chẩn đoán để sinh biến thể mới, KHÔNG phải trộn chéo lớp kèm
  # trộn nhãn kiểu Zhang và cs. Loại HCC (lớp 6) — chỉ áp cho 6 lớp thiểu số.
  #
  # `data.mixup_alpha` KHÔNG cài được phép đó, nên để 0 ở đây là đúng — nhưng vì lý do
  # "chưa cài", không phải vì "họ không dùng". Xem AGENTS.md §5.
  mixup_alpha: 0.0

  augment:
    # [REPO] `z_flip x_flip y_flip` với `args.flip_prob`, mặc định 0.5.
    flip_prob: 0.5
    flip_axes: [x, y, z]

    # [REPO] `rotation` → `rotate()` của họ bỏ qua tham số truyền vào và luôn dùng
    # `random.randint(-10, 10)`, áp cho MỌI mẫu ⇒ biên độ 10°, xác suất 1.0.
    rotate_degrees: 10
    rotate_prob: 1.0
    # [LỆCH] BẮT BUỘC `nearest`. Họ xoay bằng `ndimage.rotate(mode='constant')` nên có dải 0 ở
    # góc; E12 đã đo lỗi đó làm ~100% mẫu train mang dải đệm 0 mà val thì không (WORKLOG
    # S-111). Với lề 8 voxel của cache này, `constant` để lọt tới 517 voxel bị lấp ở offset
    # biên, `nearest` cho 0 ở MỌI offset. Đây là chỗ ta CỐ Ý tốt hơn họ.
    rotate_mode: nearest

    # TẮT: `RandomCrop3D` (bật bởi `crop_size`) đã làm việc dịch mà không đệm 0. Bật cả hai
    # sẽ raise trong `build_train_transform`.
    translate_voxels: [0, 0, 0]
    rot90_prob: 0               # xoay 90° không phải biến đổi giải phẫu hợp lệ
    intensity_prob: 0           # họ không dùng; và E6 đã đo nó gây hại (S-102)

    # --- BA AUGMENT LỌC KHÔNG GIAN ---
    # [REPO] `--train_transform_list ... edge emboss filter`, và cây quyết định trong
    # `mp_liver_dataset.py::transforms` LOẠI TRỪ NHAU:
    #     seed>0.9 edge (10%) | >0.8 emboss (10%) | >0.4 filter (40%) | còn lại không gì (40%)
    #     trong nhánh filter: >0.8 blur (20%) | >0.6 sharpen (20%) | >0.5 unsharp (10%)
    #                         | ≤0.5 KHÔNG GÌ (50%)
    # ⇒ tổng 60% mẫu train không bị phép nào. Nhẹ hơn nhiều so với "bật cả ba".
    #
    # ⚠️ Chẩn đoán §5 của AGENTS.md ("thêm augmentation" bị loại) KHÔNG loại được nhóm này:
    # §5 đo E4 so E6b, hai cấu hình chỉ khác augmentation HÌNH HỌC và scale cường độ. Đây là
    # họ khác — lọc không gian đổi KẾT CẤU. Dự án chưa từng thử.
    edge_prob: 0.10
    emboss_prob: 0.10
    filter_prob: 0.40
    blur_prob: 0.20
    sharpen_prob: 0.20
    unsharp_prob: 0.10
    # [REPO] false = tái lập đúng hành vi của họ. Họ gọi `ndimage.gaussian_filter(image_4d,
    # sigma=1)` nên scipy broadcast σ ra CẢ trục pha ⇒ blur/unsharp TRỘN 8 pha vào nhau. Gần
    # như chắc chắn ngoài ý định của họ, nhưng nó nằm trong recipe đạt 0.8078.
    # ⚠️ Đặt true là ablation MỘT khoá cho giả thuyết đắt nhất của dự án (E6/S-102: xáo cường
    # độ độc lập từng pha làm ICC −0.085, di căn −0.111).
    filter_spatial_only: false

loss:
  # [REPO] `--cb_loss` → `ClassBalancedLoss(samples_per_class=count, is_smoothing=True)`, và
  # `loss_type` mặc định của lớp đó là **"focal"**.
  #
  # ⚠️ [LỆCH] focal của họ là bản **sigmoid** (BCE trên one-hot, đúng code gốc của Cui và cs.);
  # `src/train/losses.py::focal_loss` của ta là bản **softmax**. Cùng họ hàm, khác dạng. Đây là
  # chỗ lệch đáng kể nhất trong file này — phải ghi vào báo cáo.
  name: focal
  # [SUY] Họ không nói gamma. 2.0 là mặc định của Lin và cs., và cũng là của CGHNet.
  gamma: 2.0

  # [REPO] `--cb_loss` chính là trọng số "số mẫu hiệu dụng" của Cui và cs. 2019 —
  # `src/train/losses.py::effective_number_weights` đã cài đúng công thức `1 − β^n`.
  class_weights: effective_number
  # [REPO] `beta=0.9999` là mặc định trong `losses/cb_loss.py` của họ; cũng là mặc định của ta.
  beta: 0.9999

  # [REPO] `--smoothing 0.1`. Khoá này đã có trong dự án từ đầu và CHƯA BAO GIỜ đặt > 0 ở một
  # config nào chạy thật. `configs/e14_mixup.yaml` dùng 0.05; ở đây 0.1 vì họ dùng 0.1.
  label_smoothing: 0.1

  deep_supervision: false     # UniFormer một đầu ra, không như CGHNet

train:
  # [REPO] `--epochs 300`.
  epochs: 300
  # [REPO] `--warmup-epochs 5`.
  warmup_epochs: 5
  # [SUY] Họ dùng scheduler cosine của timm; `--warmup-lr` mặc định 1e-6, `--min-lr` 1e-5.
  warmup_lr: 0.000001
  min_lr: 0.00001
  # [REPO] `--lr 1e-4`.
  lr: 0.0001
  # [REPO] `train.sh` KHÔNG truyền `--weight-decay`, nên lấy mặc định của timm = 0.05.
  # Trùng baseline official; khác CGHNet (1e-5).
  weight_decay: 0.05
  # Hiệu dụng = batch_size 4 × 1 = 4.
  accum_steps: 1
  # [REPO] Họ train đủ 300 epoch, không early stop.
  early_stop_patience: 0
  amp: true
  deterministic: true
  resume: true
